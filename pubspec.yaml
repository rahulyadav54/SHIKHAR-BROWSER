name: shikhar_browser
description: "SHIKHAR Browser - YOUR WORLD. YOUR WEB. Cross-platform Chromium-based browser for Android and Windows."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database & Storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # WebViews
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.1.0
  webview_windows:
    path: plugins/webview_windows

  # Multimedia & Video Player
  video_player: ^2.9.2
  video_player_win: ^3.3.1

  # Networking, Downloads & AI Services
  http: ^1.2.2
  dio: ^5.8.0+1

  # Utilities & UI
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.1
  open_filex: ^4.7.0
  uuid: ^4.5.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/branding/
    - assets/videos/
